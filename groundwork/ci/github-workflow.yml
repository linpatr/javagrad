name: Groundwork mod

on:
  push:
    paths:
      - 'groundwork/**'
      - '.github/workflows/groundwork.yml'
  pull_request:
    paths:
      - 'groundwork/**'
      - '.github/workflows/groundwork.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: groundwork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Upload mod jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-mod
          path: groundwork/fabric/build/libs/*.jar
          if-no-files-found: error
